<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP System - نظام تخطيط موارد المؤسسات</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">
    </script>
    <script src="https://unpkg.com/lucide@latest">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a73e8;
            --sidebar-bg: #0f172a;
            --sidebar-hover: #1e293b;
            --accent-green: #059669;
            --accent-red: #dc2626;
            --accent-purple: #7c3aed;
            --accent-orange: #ea580c;
            --card-shadow: 0 1px 3px rgba(0, 0, 0, .06), 0 1px 2px rgba(0, 0, 0, .04);
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f1f5f9;
        }
        .sidebar-item {
            transition: all 0.2s ease;
            border-radius: 10px;
            margin: 2px 0;
            font-weight: 500;
            font-size: 13px;
        }
        .sidebar-item.active {
            background: linear-gradient(135deg, #1a73e8, #1d4ed8);
            color: #fff;
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.35);
        }
        .sidebar-item:hover:not(.active) {
            background-color: var(--sidebar-hover);
        }
        .modal {
            transition: opacity 0.2s ease;
        }
        body.modal-active {
            overflow: hidden !important;
        }
        .invoice-item-row {
            transition: all 0.15s ease;
        }
        .invoice-item-row:hover {
            background-color: #f8fafc;
        }
        .card {
            background: #fff;
            border-radius: 14px;
            box-shadow: var(--card-shadow);
            border: 1px solid #e2e8f0;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-raw {
            background: #fef3c7;
            color: #92400e;
        }
        .badge-semi {
            background: #dbeafe;
            color: #1e40af;
        }
        .badge-finished {
            background: #d1fae5;
            color: #065f46;
        }
        .debit-row {
            border-right: 4px solid #dc2626;
        }
        .credit-row {
            border-right: 4px solid #059669;
        }
        .statement-debit {
            color: #dc2626;
            font-weight: 700;
        }
        .statement-credit {
            color: #059669;
            font-weight: 700;
        }
        input,
        select,
        textarea {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 9px 12px;
            font-size: 14px;
            transition: border-color 0.2s;
            font-family: 'Cairo', sans-serif;
        }
        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #1a73e8;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.1);
        }
        label {
            font-weight: 600;
            font-size: 13px;
            color: #374151;
            margin-bottom: 4px;
            display: block;
        }
        .btn-primary {
            background: linear-gradient(135deg, #1a73e8, #1d4ed8);
            color: #fff;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
        }
        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(26, 115, 232, 0.4);
            transform: translateY(-1px);
        }
        .btn-success {
            background: linear-gradient(135deg, #059669, #047857);
            color: #fff;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
        }
        .btn-success:hover {
            box-shadow: 0 6px 20px rgba(5, 150, 105, 0.4);
            transform: translateY(-1px);
        }
        .stat-card {
            background: #fff;
            border-radius: 14px;
            padding: 18px 20px;
            box-shadow: var(--card-shadow);
            border: 1px solid #e2e8f0;
            transition: all 0.2s;
        }
        .stat-card:hover {
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }
        table {
            border-collapse: separate;
            border-spacing: 0;
        }
        table th {
            font-weight: 700;
            font-size: 13px;
            color: #4b5563;
            background: #f9fafb;
            position: sticky;
            top: 0;
        }
        table td {
            font-size: 13px;
        }
        .section-title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        @media print {
            .sidebar,
            header,
            .no-print {
                display: none !important;
            }
            body {
                background: #fff;
            }
        }
        .chart-container {
            position: relative;
            width: 100%;
            max-height: 300px;
        }
        .tree-item {
            cursor: pointer;
            transition: all 0.15s;
            border-radius: 6px;
            padding: 6px 10px;
        }
        .tree-item:hover {
            background: #f1f5f9;
        }
        .tree-children {
            margin-right: 20px;
            border-right: 2px dashed #e2e8f0;
            padding-right: 10px;
        }
    </style>
</head>
<body class="bg-slate-100">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="sidebar w-64 bg-[#0f172a] text-white flex flex-col transition-all duration-300 flex-shrink-0">
            <div class="p-5 text-center border-b border-slate-700/50">
                <h1 class="text-xl font-extrabold tracking-wide text-white">ERP System</h1>
                <p class="text-xs text-slate-400 mt-1">نظام تخطيط موارد المؤسسات</p>
                <p class="text-[10px] text-slate-500 mt-0.5">الإصدار 3.5.0 © 2026</p>
            </div>
            <nav class="flex-1 mt-4 px-3 space-y-1 overflow-y-auto">
                <button onclick="showSection('dashboard')" class="sidebar-item w-full flex items-center p-2.5 active" id="btn-dashboard">
                    <i data-lucide="layout-dashboard" class="ml-3" size="18"></i> لوحة التحكم
                </button>
                <button onclick="showSection('customers')" class="sidebar-item w-full flex items-center p-2.5" id="btn-customers">
                    <i data-lucide="users" class="ml-3" size="18"></i> العملاء
                </button>
                <button onclick="showSection('suppliers')" class="sidebar-item w-full flex items-center p-2.5" id="btn-suppliers">
                    <i data-lucide="truck" class="ml-3" size="18"></i> الموردين
                </button>
                <button onclick="showSection('inventory')" class="sidebar-item w-full flex items-center p-2.5" id="btn-inventory">
                    <i data-lucide="package" class="ml-3" size="18"></i> المخزون
                </button>
                <button onclick="showSection('invoices')" class="sidebar-item w-full flex items-center p-2.5" id="btn-invoices">
                    <i data-lucide="file-text" class="ml-3" size="18"></i> الفواتير
                </button>
                <button onclick="showSection('payments')" class="sidebar-item w-full flex items-center p-2.5" id="btn-payments">
                    <i data-lucide="credit-card" class="ml-3" size="18"></i> السداد والتحصيل
                </button>
                <button onclick="showSection('accounting')" class="sidebar-item w-full flex items-center p-2.5" id="btn-accounting">
                    <i data-lucide="book-open" class="ml-3" size="18"></i> القيود اليومية
                </button>
                <button onclick="showSection('chartOfAccounts')" class="sidebar-item w-full flex items-center p-2.5" id="btn-chartOfAccounts">
                    <i data-lucide="git-branch" class="ml-3" size="18"></i> شجرة الحسابات
                </button>
                <button onclick="showSection('costs')" class="sidebar-item w-full flex items-center p-2.5" id="btn-costs">
                    <i data-lucide="pie-chart" class="ml-3" size="18"></i> التكاليف والتقارير
                </button>
                <button onclick="showSection('profit')" class="sidebar-item w-full flex items-center p-2.5" id="btn-profit">
                    <i data-lucide="trending-up" class="ml-3" size="18"></i> أرباح المنتجات
                </button>
                <button onclick="showSection('financialStatements')" class="sidebar-item w-full flex items-center p-2.5" id="btn-financialStatements">
                    <i data-lucide="file-bar-chart" class="ml-3" size="18"></i> القوائم المالية
                </button>
                <button onclick="showSection('monthlyClosing')" class="sidebar-item w-full flex items-center p-2.5" id="btn-monthlyClosing">
                    <i data-lucide="calendar-check" class="ml-3" size="18"></i> الإقفال الشهري
                </button>
                <button onclick="showSection('backup')" class="sidebar-item w-full flex items-center p-2.5" id="btn-backup">
                    <i data-lucide="database" class="ml-3" size="18"></i> النسخ والبيانات
                </button>
            </nav>
            <div class="p-3 border-t border-slate-700/50 text-center text-[10px] text-slate-500">
                ERP System v3.5 © 2026
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <header class="bg-white shadow-sm z-10 p-3 px-5 flex justify-between items-center border-b border-gray-200 no-print">
                <div class="flex items-center gap-3">
                    <h2 id="section-title" class="text-lg font-bold text-gray-800">لوحة التحكم</h2>
                </div>
                <div class="flex items-center gap-3">
                    <span id="current-date" class="text-sm text-gray-500"></span>
                    <div class="h-9 w-9 rounded-full bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center text-white shadow">
                        <i data-lucide="user" size="17"></i>
                    </div>
                </div>
            </header>
            <div class="flex-1 overflow-y-auto p-5" id="main-content">
                <section id="dashboard" class="space-y-5"></section>
                <section id="customers" class="hidden"></section>
                <section id="suppliers" class="hidden"></section>
                <section id="inventory" class="hidden"></section>
                <section id="invoices" class="hidden"></section>
                <section id="payments" class="hidden"></section>
                <section id="accounting" class="hidden"></section>
                <section id="chartOfAccounts" class="hidden"></section>
                <section id="costs" class="hidden"></section>
                <section id="profit" class="hidden"></section>
                <section id="financialStatements" class="hidden"></section>
                <section id="monthlyClosing" class="hidden"></section>
                <section id="backup" class="hidden"></section>
            </div>
        </main>
    </div>

    <!-- Main Modal -->
    <div id="modal-overlay" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div id="modal-content" class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden" style="max-height:92vh;">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50 sticky top-0 z-10 rounded-t-2xl">
                <h3 id="modal-title" class="font-bold text-lg text-gray-800">إضافة جديد</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 p-1 rounded-full hover:bg-gray-200 transition"><i data-lucide="x" size="20"></i></button>
            </div>
            <div id="modal-body" class="p-5 overflow-y-auto" style="max-height:60vh;"></div>
            <div class="p-4 border-t bg-gray-50 flex justify-end gap-2 sticky bottom-0 rounded-b-2xl">
                <button onclick="closeModal()" class="px-5 py-2.5 text-gray-600 hover:bg-gray-200 rounded-lg transition font-semibold text-sm">إلغاء</button>
                <button id="modal-save-btn" class="btn-primary text-sm">حفظ</button>
            </div>
        </div>
    </div>

    <!-- Statement Modal -->
    <div id="statement-overlay" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl overflow-hidden" style="max-height:92vh;">
            <div class="p-4 border-b flex justify-between items-center bg-gradient-to-r from-blue-50 to-indigo-50 sticky top-0 z-10 rounded-t-2xl">
                <h3 id="statement-title" class="font-bold text-lg text-gray-800">كشف حساب</h3>
                <button onclick="closeStatement()" class="text-gray-400 hover:text-gray-600 p-1 rounded-full hover:bg-gray-200 transition"><i data-lucide="x" size="20"></i></button>
            </div>
            <div id="statement-body" class="p-5 overflow-y-auto" style="max-height:60vh;"></div>
            <div class="p-4 border-t bg-gray-50 flex justify-end rounded-b-2xl">
                <button onclick="printStatement()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-semibold text-sm flex items-center gap-2 no-print">
                    <i data-lucide="printer" size="16"></i> طباعة
                </button>
                <button onclick="closeStatement()" class="px-5 py-2 bg-slate-700 text-white rounded-lg hover:bg-slate-800 transition font-semibold text-sm mr-2">إغلاق</button>
            </div>
        </div>
    </div>

    <!-- Invoice PDF Preview Modal -->
    <div id="invoice-pdf-overlay" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl overflow-hidden" style="max-height:92vh;">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50 sticky top-0 z-10 rounded-t-2xl">
                <h3 class="font-bold text-lg text-gray-800">معاينة الفاتورة</h3>
                <button onclick="closeInvoicePDF()" class="text-gray-400 hover:text-gray-600 p-1 rounded-full hover:bg-gray-200 transition"><i data-lucide="x" size="20"></i></button>
            </div>
            <div id="invoice-pdf-body" class="p-5 overflow-y-auto bg-white" style="max-height:60vh;"></div>
            <div class="p-4 border-t bg-gray-50 flex justify-end gap-2 rounded-b-2xl">
                <button onclick="printInvoicePDF()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-semibold text-sm flex items-center gap-2"><i data-lucide="printer" size="16"></i> طباعة / حفظ PDF</button>
                <button onclick="closeInvoicePDF()" class="px-5 py-2 bg-slate-700 text-white rounded-lg hover:bg-slate-800 transition font-semibold text-sm">إغلاق</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // ─────────────────── DATABASE ───────────────────
        let db = JSON.parse(localStorage.getItem('erp_db_v3')) || {
            customers: [],
            suppliers: [],
            inventory: [],
            invoices: [],
            entries: [],
            costs: [],
            payments: [],
            chartOfAccounts: [],
            monthlyClosings: []
        };
        if (!db.payments) db.payments = [];
        if (!db.invoices) db.invoices = [];
        if (!db.entries) db.entries = [];
        if (!db.costs) db.costs = [];
        if (!db.chartOfAccounts) db.chartOfAccounts = [];
        if (!db.monthlyClosings) db.monthlyClosings = [];
        if (db.chartOfAccounts.length === 0) {
            db.chartOfAccounts = [
                { id: 1, code: '1', name: 'الأصول', type: 'asset', parentId: null },
                { id: 2, code: '1.1', name: 'النقدية', type: 'asset', parentId: 1 },
                { id: 3, code: '1.2', name: 'العملاء', type: 'asset', parentId: 1 },
                { id: 4, code: '1.3', name: 'المخزون', type: 'asset', parentId: 1 },
                { id: 5, code: '2', name: 'الخصوم', type: 'liability', parentId: null },
                { id: 6, code: '2.1', name: 'الموردين', type: 'liability', parentId: 5 },
                { id: 7, code: '2.2', name: 'قروض', type: 'liability', parentId: 5 },
                { id: 8, code: '3', name: 'حقوق الملكية', type: 'equity', parentId: null },
                { id: 9, code: '3.1', name: 'رأس المال', type: 'equity', parentId: 8 },
                { id: 10, code: '4', name: 'الإيرادات', type: 'revenue', parentId: null },
                { id: 11, code: '4.1', name: 'المبيعات', type: 'revenue', parentId: 10 },
                { id: 12, code: '5', name: 'المصروفات', type: 'expense', parentId: null },
                { id: 13, code: '5.1', name: 'تكاليف البضاعة المباعة', type: 'expense', parentId: 12 },
                { id: 14, code: '5.2', name: 'مصروفات تشغيلية', type: 'expense', parentId: 12 },
            ];
        }

        function saveData() {
            localStorage.setItem('erp_db_v3', JSON.stringify(db));
            updateDashboard();
        }

        let currentInvoiceType = 'sale';
        let currentStatementData = null;
        let currentEditData = null;
        let currentInvoicePDFData = null;

        // ─────────────────── NAVIGATION ───────────────────
        function showSection(id) {
            document.querySelectorAll('#main-content > section').forEach(s => s.classList.add('hidden'));
            const target = document.getElementById(id);
            if (target) target.classList.remove('hidden');
            document.querySelectorAll('.sidebar-item').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById('btn-' + id);
            if (btn) btn.classList.add('active');
            const titles = {
                dashboard: 'لوحة التحكم',
                customers: 'إدارة العملاء',
                suppliers: 'إدارة الموردين',
                inventory: 'إدارة المخزون',
                invoices: 'إدارة الفواتير',
                payments: 'السداد والتحصيل',
                accounting: 'القيود اليومية',
                chartOfAccounts: 'شجرة الحسابات',
                costs: 'التكاليف والتقارير',
                profit: 'أرباح المنتجات',
                financialStatements: 'القوائم المالية',
                monthlyClosing: 'الإقفال الشهري',
                backup: 'النسخ الاحتياطي والبيانات'
            };
            document.getElementById('section-title').innerText = titles[id] || id;
            renderSection(id);
        }

        function renderSection(id) {
            const container = document.getElementById(id);
            if (!container) return;
            if (id === 'dashboard') { updateDashboard(); return; }
            if (id === 'customers') renderCustomers();
            if (id === 'suppliers') renderSuppliers();
            if (id === 'inventory') renderInventory();
            if (id === 'invoices') renderInvoices();
            if (id === 'payments') renderPayments();
            if (id === 'accounting') renderAccounting();
            if (id === 'chartOfAccounts') renderChartOfAccounts();
            if (id === 'costs') renderCosts();
            if (id === 'profit') renderProfit();
            if (id === 'financialStatements') renderFinancialStatements();
            if (id === 'monthlyClosing') renderMonthlyClosing();
            if (id === 'backup') renderBackup();
            lucide.createIcons();
        }

        function getProductTypeLabel(code) {
            if (code === 1 || code === '1') return '<span class="badge badge-raw">مادة خام (1)</span>';
            if (code === 2 || code === '2') return '<span class="badge badge-semi">نصف مصنع (2)</span>';
            if (code === 3 || code === '3') return '<span class="badge badge-finished">منتج كامل (3)</span>';
            return '<span class="badge bg-gray-100 text-gray-600">غير محدد</span>';
        }

        function getProductTypeName(code) {
            if (code === 1 || code === '1') return 'مادة خام';
            if (code === 2 || code === '2') return 'نصف مصنع';
            if (code === 3 || code === '3') return 'منتج كامل';
            return 'غير محدد';
        }

        function getAccountTypeName(type) {
            const map = { asset: 'أصول', liability: 'خصوم', equity: 'حقوق ملكية', revenue: 'إيرادات', expense: 'مصروفات' };
            return map[type] || type;
        }

        // ─────────────────── CUSTOMERS ───────────────────
        function renderCustomers() {
            const container = document.getElementById('customers');
            container.innerHTML = `
            <div class="card p-5">
              <div class="section-title-bar">
                <h3 class="text-lg font-bold">قائمة العملاء</h3>
                <div class="flex gap-2 flex-wrap">
                  <button onclick="downloadCustomersTemplate()" class="bg-green-600 text-white px-3 py-2 rounded-lg text-sm flex items-center gap-1 hover:bg-green-700"><i data-lucide="download" size="15"></i> تمبليت Excel</button>
                  <button onclick="document.getElementById('customers-excel-upload').click()" class="bg-blue-600 text-white px-3 py-2 rounded-lg text-sm flex items-center gap-1 hover:bg-blue-700"><i data-lucide="upload" size="15"></i> رفع Excel</button>
                  <input type="file" id="customers-excel-upload" accept=".xlsx,.xls" class="hidden" onchange="handleCustomersExcelUpload(event)">
                  <button onclick="openModal('customer')" class="btn-primary flex items-center gap-2 text-sm"><i data-lucide="plus" size="17"></i> إضافة عميل</button>
                </div>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-right"><thead><tr><th class="p-3">الكود</th><th class="p-3">الاسم</th><th class="p-3">الهاتف</th><th class="p-3">النوع</th><th class="p-3">الرصيد</th><th class="p-3">الإجراءات</th></tr></thead>
                <tbody>${db.customers.length===0?'<tr><td colspan="6" class="p-4 text-center text-gray-400">لا يوجد عملاء</td></tr>':
                db.customers.map((c,i)=>`<tr class="border-b hover:bg-gray-50"><td class="p-3 font-mono text-blue-600 text-sm">${c.code||'-'}</td><td class="p-3 font-semibold">${c.name}</td><td class="p-3 text-sm">${c.phone||'-'}</td><td class="p-3 text-sm">${c.customerType||'-'}</td><td class="p-3 font-bold ${(c.balance||0)>=0?'text-green-600':'text-red-600'}">${(c.balance||0).toFixed(2)}</td><td class="p-3 flex gap-1 flex-wrap"><button onclick="viewCustomerStatement(${i})" class="text-blue-600 hover:text-blue-800 text-xs bg-blue-50 px-2 py-1 rounded flex items-center gap-1"><i data-lucide="file-search" size="14"></i> كشف</button><button onclick="editCustomer(${i})" class="text-orange-500 hover:text-orange-700 text-xs bg-orange-50 px-2 py-1 rounded flex items-center gap-1"><i data-lucide="pencil" size="14"></i> تعديل</button><button onclick="deleteItem('customers',${i})" class="text-red-500 hover:text-red-700"><i data-lucide="trash-2" size="16"></i></button></td></tr>`).join('')}</tbody></table>
              </div>
            </div>`;
            lucide.createIcons();
        }

        function downloadCustomersTemplate() {

        function deleteInvoice(invoiceId) {
            if (!confirm('هل أنت متأكد من حذف هذه الفاتورة؟')) return;
            const invIndex = db.invoices.findIndex(inv => inv.id === invoiceId);
            if (invIndex === -1) return;
            const inv = db.invoices[invIndex];
            if (inv.items) inv.items.forEach(item => { const invItem = db.inventory[item.inventoryId]; if (invItem) { if (inv
                        .type === 'sale') invItem.quantity += (item.quantity || 0);
                    else invItem.quantity = Math.max(0, invItem.quantity - (item.quantity || 0)); } });
            if (inv.type === 'sale' && inv.customerId != null && db.customers[inv.customerId]) db.customers[inv.customerId]
                .balance = (db.customers[inv.customerId].balance || 0) - (inv.total || 0);
            else if (inv.type === 'purchase' && inv.supplierId != null && db.suppliers[inv.supplierId]) db.suppliers[inv
                .supplierId].balance = (db.suppliers[inv.supplierId].balance || 0) - (inv.total || 0);
            db.entries = db.entries.filter(e => e.invoiceId !== invoiceId);
            db.invoices.splice(invIndex, 1);
            saveData();
            renderSection('invoices');
        }

            const container = document.getElementById('invoice-items-container');

            if (noMsg) noMsg.remove();
            const invOptions = db.inventory.map((item, i) =>

        function updateInvoiceItemPrice(selectEl) {
            const row = selectEl.closest('.invoice-item-row');
            const index = parseInt(selectEl.value);
            const priceInput = row.querySelector('.inv-price');
            const costSpan = row.querySelector('.inv-line-cost');
            if (!isNaN(index) && db.inventory[index]) {
                priceInput.value = db.inventory[index].sellingPrice || db.inventory[index].costPrice || 0;
                costSpan.innerText = (db.inventory[index].costPrice || 0).toFixed(2);
                costSpan.setAttribute('data-cost', db.inventory[index].costPrice || 0);
            }
            updateInvoiceLineTotal(row.querySelector('.inv-qty'));
        }

        function updateInvoiceLineTotal(inputEl) {
            const row = inputEl.closest('.invoice-item-row');
            const qty = parseFloat(row.querySelector('.inv-qty').value) || 0;
            const price = parseFloat(row.querySelector('.inv-price').value) || 0;
            const costSpan = row.querySelector('.inv-line-cost');
            const unitCost = parseFloat(costSpan.getAttribute('data-cost')) || 0;
            row.querySelector('.inv-line-total').innerText = (qty * price).toFixed(2);
            calculateInvoiceGrandTotal();
        }

        function calculateInvoiceGrandTotal() {
            const totals = document.querySelectorAll('.inv-line-total');
            const costSpans = document.querySelectorAll('.inv-line-cost');
            let grandTotal = 0,
                totalCost = 0;
            totals.forEach(el => { grandTotal += parseFloat(el.innerText) || 0; });
            costSpans.forEach(el => { const row = el.closest('.invoice-item-row'); if (row) { const qty = parseFloat(row
                        .querySelector('.inv-qty').value) || 0;
                    totalCost += (parseFloat(el.getAttribute('data-cost')) || 0) * qty; } });
            const totalProfit = grandTotal - totalCost;
            const gtEl = document.getElementById('inv-grand-total');
            const tcEl = document.getElementById('inv-total-cost');
            const tpEl = document.getElementById('inv-total-profit');
            if (gtEl) gtEl.innerText = grandTotal.toFixed(2);
            if (tcEl) tcEl.innerText = totalCost.toFixed(2);
            if (tpEl) { tpEl.innerText = totalProfit.toFixed(2);
                tpEl.style.color = totalProfit >= 0 ? '#059669' : '#dc2626'; }
        }

        function saveInvoiceFromModal() {
            const isSale = currentInvoiceType === 'sale';
            const invoiceNumber = document.getElementById('inv-number').value.trim();
            const entitySelect = document.getElementById('inv-entity');
            const dateInput = document.getElementById('inv-date');
            const descInput = document.getElementById('inv-desc');
            const itemRows = document.querySelectorAll('#invoice-items-container .invoice-item-row');
            if (!invoiceNumber) { alert('الرجاء إدخال رقم الفاتورة.'); return; }
            const entityIndex = parseInt(entitySelect.value);
            if (isNaN(entityIndex) || entityIndex < 0) { alert(isSale ? 'الرجاء اختيار عميل.' : 'الرجاء اختيار مورد.');
                return; }
            if (!dateInput.value) { alert('الرجاء تحديد التاريخ.'); return; }
            if (itemRows.length === 0) { alert('الرجاء إضافة صنف واحد على الأقل.'); return; }
            const items = [];
            let hasError = false;
            itemRows.forEach(row => {
                const invIndex = parseInt(row.querySelector('.inv-item-select').value);
                const qty = parseFloat(row.querySelector('.inv-qty').value) || 0;
                const price = parseFloat(row.querySelector('.inv-price').value) || 0;
                const costSpan = row.querySelector('.inv-line-cost');
                const unitCost = parseFloat(costSpan.getAttribute('data-cost')) || 0;
                if (isNaN(invIndex) || invIndex < 0 || !db.inventory[invIndex]) { hasError = true; return; }
                if (qty <= 0) { hasError = true; return; }
                if (isSale && db.inventory[invIndex].quantity < qty) { alert('المخزون غير كافٍ: ' + db.inventory[invIndex]
                        .name);
                    hasError = true; return; }
                items.push({ inventoryId: invIndex, name: db.inventory[invIndex].name, quantity: qty, unitPrice: price,
                    unitCost: unitCost, lineTotal: qty * price, lineCost: qty * unitCost, lineProfit: (qty * price) - (
                        qty * unitCost) });
            });
            if (hasError) return;
            const grandTotal = items.reduce((s, it) => s + it.lineTotal, 0);
            const totalCost = items.reduce((s, it) => s + it.lineCost, 0);
            const invoiceId = Date.now();
            const invoice = { id: invoiceId, invoiceNumber, type: currentInvoiceType, customerId: isSale ? entityIndex :
                    null, supplierId: !isSale ? entityIndex : null, date: dateInput.value, description: descInput.value ||
                    '', items, total: grandTotal, totalCost, totalProfit: grandTotal - totalCost,
            createdAt: new Date().toISOString() };
            items.forEach(item => { const invItem = db.inventory[item.inventoryId]; if (invItem) { if (isSale) invItem
                        .quantity -= item.quantity;
                    else { invItem.quantity += item.quantity; if (item.unitPrice > 0) invItem.costPrice = item
                            .unitPrice; } } });
            if (isSale && db.customers[entityIndex]) db.customers[entityIndex].balance = (db.customers[entityIndex].balance ||
                0) + grandTotal;
            else if (!isSale && db.suppliers[entityIndex]) db.suppliers[entityIndex].balance = (db.suppliers[entityIndex]
                .balance || 0) + grandTotal;
            if (isSale) { db.entries.push({ date: dateInput.value, description: 'فاتورة مبيعات #' + invoiceNumber,
                    debitAccount: 'العملاء', debitAmount: grandTotal, creditAccount: 'المبيعات', creditAmount: grandTotal,
                    type: 'customer', invoiceId }); } else { db.entries.push({ date: dateInput.value,
                    description: 'فاتورة مشتريات #' + invoiceNumber, debitAccount: 'المشتريات', debitAmount: grandTotal,
                    creditAccount: 'الموردين', creditAmount: grandTotal, type: 'supplier', invoiceId }); }
            db.invoices.push(invoice);
            saveData();
            closeModal();
            renderSection('invoices');
            alert('تم حفظ الفاتورة بنجاح!');
        }

        function editPayment(index) {
            const p = db.payments[index];
            if (!p) return;
            currentEditData = { type: 'payment', index: index };
            const overlay = document.getElementById('modal-overlay');
            const body = document.getElementById('modal-body');

        function savePaymentFromModal(type) {
            const entityIndex = parseInt(document.getElementById('pmt-entity').value);
            const dateVal = document.getElementById('pmt-date').value;
            const amountVal = parseFloat(document.getElementById('pmt-amount').value) || 0;
            const methodVal = document.getElementById('pmt-method').value;
            const descVal = document.getElementById('pmt-desc').value.trim();
            const isCustomerPayment = type === 'customer_payment';
            if (isNaN(entityIndex) || entityIndex < 0) { alert('الرجاء اختيار الكيان.'); return; }
            if (!dateVal) { alert('الرجاء تحديد التاريخ.'); return; }
            if (amountVal <= 0) { alert('الرجاء إدخال مبلغ صحيح.'); return; }
            const payment = { id: Date.now(), paymentType: isCustomerPayment ? 'customer' : 'supplier', entityId: entityIndex,
                date: dateVal, amount: amountVal, method: methodVal, description: descVal || 'سداد',
                createdAt: new Date().toISOString() };
            db.payments.push(payment);
            if (isCustomerPayment && db.customers[entityIndex]) { db.customers[entityIndex].balance = (db.customers[
                    entityIndex].balance || 0) - amountVal;
                db.entries.push({ date: dateVal, description: descVal || 'تحصيل من عميل', debitAccount: 'النقدية',
                    debitAmount: amountVal, creditAccount: 'العملاء', creditAmount: amountVal, type: 'customer_payment',
                    invoiceId: null }); } else if (!isCustomerPayment && db.suppliers[entityIndex]) { db.suppliers[
                    entityIndex].balance = (db.suppliers[entityIndex].balance || 0) - amountVal;
                db.entries.push({ date: dateVal, description: descVal || 'سداد للمورد', debitAccount: 'الموردين',
                    debitAmount: amountVal, creditAccount: 'النقدية', creditAmount: amountVal, type: 'supplier_payment',
                    invoiceId: null }); }
            saveData();
            closeModal();
            renderSection('payments');
            alert('تم تسجيل السداد بنجاح!');
        }

        function downloadCostsTemplate() {
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{ "التاريخ": "2026-01-01", "الفئة": "مواد خام",

            XLSX.writeFile(wb, "costs_template.xlsx");
        }

        function handleCostsExcelUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => { const data = new Uint8Array(e.target.result); const workbook = XLSX.read(data, { type: 'array' });
                let imported = 0; if (workbook.Sheets["التكاليف"]) { XLSX.utils.sheet_to_json(workbook.Sheets["التكاليف"])
                        .forEach(row => { if (row["المبلغ"] && parseFloat(row["المبلغ"]) > 0) { db.costs.push({ date: row[
                                    "التاريخ"] || new Date().toISOString().split('T')[0], category: row["الفئة"] || 'عام',
                                productName: row["المنتج"] || '', amount: parseFloat(row["المبلغ"]) || 0, notes: row[
                                    "ملاحظات"] || '' });
                            imported++; } }); } if (imported > 0) { saveData();
                    alert('تم استيراد ' + imported + ' بند');
                    renderSection('costs'); } else alert('لم يتم العثور على بيانات.');
                event.target.value = ''; };
            reader.readAsArrayBuffer(file);
        }

        // ─────────────────── FINANCIAL STATEMENTS ───────────────────
        function renderFinancialStatements() {
            const container = document.getElementById('financialStatements');
            const totalRevenue = db.entries.filter(e => e.creditAccount === 'المبيعات' || e.type === 'customer').reduce((s,
                e) => s + (e.creditAmount || 0), 0);
            const totalCOGS = db.entries.filter(e => e.debitAccount === 'المشتريات' || e.type === 'supplier').reduce((s, e) =>
                s + (e.debitAmount || 0), 0);
            const totalExpenses = db.costs.reduce((s, c) => s + (c.amount || 0), 0);
            const totalCashIn = db.payments.filter(p => p.paymentType === 'customer').reduce((s, p) => s + (p.amount || 0), 0);
            const totalCashOut = db.payments.filter(p => p.paymentType === 'supplier').reduce((s, p) => s + (p.amount || 0), 0);
            const customerBalance = db.customers.reduce((s, c) => s + (c.balance || 0), 0);
            const supplierBalance = db.suppliers.reduce((s, s2) => s + (s2.balance || 0), 0);
            const invValue = db.inventory.reduce((s, i) => s + ((i.costPrice || 0) * (i.quantity || 0)), 0);
            const netIncome = totalRevenue - totalCOGS - totalExpenses;
            const totalAssets = customerBalance + invValue + (totalCashIn - totalCashOut);
            const totalLiabilities = supplierBalance;
            const equity = totalAssets - totalLiabilities;
            const trialBalanceData = [];
            const tbMap = {};
            db.entries.forEach(e => { if (e.debitAccount) { if (!tbMap[e.debitAccount]) tbMap[e.debitAccount] = { debit: 0,
                        credit: 0 };
                    tbMap[e.debitAccount].debit += (e.debitAmount || 0); } if (e.creditAccount) { if (!tbMap[e
                        .creditAccount]) tbMap[e.creditAccount] = { debit: 0, credit: 0 };
                    tbMap[e.creditAccount].credit += (e.creditAmount || 0); } });
            for (const [name, vals] of Object.entries(tbMap)) trialBalanceData.push({ account: name, debit: vals.debit,
                credit: vals.credit, balance: vals.debit - vals.credit });

            container.innerHTML = `

        function exportFinancialToExcel() {
            const wb = XLSX.utils.book_new();
            const totalRevenue = db.entries.filter(e => e.creditAccount === 'المبيعات' || e.type === 'customer').reduce((s,
                e) => s + (e.creditAmount || 0), 0);
            const totalCOGS = db.entries.filter(e => e.debitAccount === 'المشتريات' || e.type === 'supplier').reduce((s, e) =>
                s + (e.debitAmount || 0), 0);
            const totalExpenses = db.costs.reduce((s, c) => s + (c.amount || 0), 0);
            const totalCashIn = db.payments.filter(p => p.paymentType === 'customer').reduce((s, p) => s + (p.amount || 0), 0);
            const totalCashOut = db.payments.filter(p => p.paymentType === 'supplier').reduce((s, p) => s + (p.amount || 0),
            0);
            const customerBalance = db.customers.reduce((s, c) => s + (c.balance || 0), 0);
            const supplierBalance = db.suppliers.reduce((s, s2) => s + (s2.balance || 0), 0);
            const invValue = db.inventory.reduce((s, i) => s + ((i.costPrice || 0) * (i.quantity || 0)), 0);
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{ "البند": "الأصول - العملاء", "القيمة": customerBalance },
                { "البند": "الأصول - المخزون", "القيمة": invValue }, { "البند": "الأصول - النقدية", "القيمة": totalCashIn -
                    totalCashOut }, { "البند": "الخصوم - الموردين", "القيمة": supplierBalance }, { "البند": "الإيرادات",
                    "القيمة": totalRevenue }, { "البند": "تكلفة البضاعة", "القيمة": totalCOGS }, { "البند": "المصروفات",
                    "القيمة": totalExpenses }, { "البند": "صافي الربح", "القيمة": totalRevenue - totalCOGS - totalExpenses }
            ]), "القوائم المالية");
            XLSX.writeFile(wb, "financial_statements.xlsx");
        }

        function renderMonthlyClosing() {
            const container = document.getElementById('monthlyClosing');
            const closings = db.monthlyClosings || [];
            container.innerHTML = `
            <div class="space-y-5">
              <div class="card p-5"><div class="section-title-bar"><h3 class="text-lg font-bold">الإقفال الشهري</h3><button onclick="performMonthlyClosing()" class="bg-indigo-600 text-white px-4 py-2.5 rounded-xl text-sm hover:bg-indigo-700 flex items-center gap-2"><i data-lucide="lock" size="17"></i> إقفال الشهر الحالي</button></div>
              <div class="grid grid-cols-2 gap-4 mb-4"><div class="stat-card"><p class="text-xs text-gray-500">عدد الإقفالات</p><h4 class="text-xl font-bold">${closings.length}</h4></div><div class="stat-card"><p class="text-xs text-gray-500">آخر إقفال</p><h4 class="text-xl font-bold">${closings.length>0?closings[closings.length-1].period:'-'}</h4></div></div>
              <div class="overflow-x-auto"><table class="w-full text-right"><thead><tr><th class="p-3">الفترة</th><th class="p-3">الإيرادات</th><th class="p-3">المصروفات</th><th class="p-3">صافي الربح</th><th class="p-3">تاريخ الإقفال</th><th class="p-3">إجراءات</th></tr></thead>

              ${closings.length>0?`<div class="card p-5"><h3 class="text-lg font-bold mb-4">الرسم البياني للإقفالات</h3><div class="chart-container"><canvas id="closingChart"></canvas></div></div>`:''}
            </div>`;

        function drawClosingChart() {
            const canvas = document.getElementById('closingChart');
            if (!canvas) return;
            const closings = db.monthlyClosings || [];
            const ctx = canvas.getContext('2d');
            if (canvas._chart) canvas._chart.destroy();
            canvas._chart = new Chart(ctx, {
                type: 'bar',
                data: { labels: closings.map(c => c.period), datasets: [
                        { label: 'الإيرادات', data: closings.map(c => c.revenue || 0),
                            backgroundColor: 'rgba(5,150,105,0.6)', borderColor: '#059669', borderWidth: 1 },
                        { label: 'المصروفات', data: closings.map(c => c.expenses || 0),
                            backgroundColor: 'rgba(220,38,38,0.6)', borderColor: '#dc2626', borderWidth: 1 },
                        { label: 'صافي الربح', data: closings.map(c => c.netIncome || 0),
                            backgroundColor: 'rgba(26,115,232,0.6)', borderColor: '#1a73e8', borderWidth: 1 }
                    ] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top',
                            labels: { font: { family: 'Cairo' } } } }, scales: { y: { beginAtZero: true } } }
            });
        }

        function performMonthlyClosing() {
            const now = new Date();
            const period = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
            const totalRevenue = db.entries.filter(e => e.creditAccount === 'المبيعات' || e.type === 'customer').reduce((s,
                e) => s + (e.creditAmount || 0), 0);
            const totalExpenses = db.costs.reduce((s, c) => s + (c.amount || 0), 0);
            const netIncome = totalRevenue - totalExpenses;
            const closing = { period, revenue: totalRevenue, expenses: totalExpenses, netIncome, closedAt: new Date()
                    .toISOString(), customerBalance: db.customers.reduce((s, c) => s + (c.balance || 0), 0),
                supplierBalance: db.suppliers.reduce((s, s2) => s + (s2.balance || 0), 0), invValue: db.inventory.reduce(
                    (s, i) => s + ((i.costPrice || 0) * (i.quantity || 0)), 0), entryCount: db.entries.length,
                invoiceCount: db.invoices.length };
            db.monthlyClosings.push(closing);
            saveData();
            alert('تم الإقفال الشهري للفترة: ' + period);
            renderSection('monthlyClosing');
        }

        function exportClosingToExcel(index) {
            const c = db.monthlyClosings[index];
            if (!c) return;
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{ "الفترة": c.period, "الإيرادات": c.revenue,

                        amount <= 0) { alert('المبلغ مطلوب'); return; }
                    db.costs.push({ category: document.getElementById('f-cat').value.trim() || 'عام', productName: document
                            .getElementById('f-prod-name').value, amount, date: document.getElementById('f-date').value,
                        notes: document.getElementById('f-notes').value.trim() });
                    finalizeModal('costs'); };
            } else if (type === 'entry') {
                title.innerText = 'قيد محاسبي';
                body.innerHTML = `<div class="space-y-3"><div><label>التاريخ</label><input id="f-date" class="w-full" type="date" value="${new Date().toISOString().split('T')[0]}"></div>
                <div><label>البيان</label><input id="f-desc" class="w-full"></div>
                <div class="grid grid-cols-2 gap-3"><div><label>حساب مدين</label><input id="f-debit-acc" class="w-full" list="accounts-list"><datalist id="accounts-list">${db.chartOfAccounts.map(a=>`<option value="${a.name}">`).join('')}</datalist></div><div><label>مبلغ مدين</label><input id="f-debit-amt" class="w-full" type="number" value="0" step="0.01"></div></div>
                <div class="grid grid-cols-2 gap-3"><div><label>حساب دائن</label><input id="f-credit-acc" class="w-full" list="accounts-list"></div><div><label>مبلغ دائن</label><input id="f-credit-amt" class="w-full" type="number" value="0" step="0.01"></div></div></div>`;
                saveBtn.onclick = () => { const desc = document.getElementById('f-desc').value.trim(); if (!desc) { alert(
                            'البيان مطلوب'); return; }
                    db.entries.push({ date: document.getElementById('f-date').value, description: desc, debitAccount: document
                            .getElementById('f-debit-acc').value, debitAmount: parseFloat(document.getElementById(
                                'f-debit-amt').value) || 0, creditAccount: document.getElementById('f-credit-acc').value,
                        creditAmount: parseFloat(document.getElementById('f-credit-amt').value) || 0, type: 'manual',
                        invoiceId: null });
                    finalizeModal('accounting'); };
            } else if (type === 'customer_payment' || type === 'supplier_payment') {
                const isCust = type === 'customer_payment';
                title.innerText = isCust ? 'سداد عميل' : 'سداد مورد';
                const entityOptions = isCust ? db.customers.map((c, i) =>
                    `<option value="${i}">${c.name} (${(c.balance||0).toFixed(2)})</option>`).join('') : db.suppliers.map((
                    s, i) => `<option value="${i}">${s.name} (${(s.balance||0).toFixed(2)})</option>`).join('');
                body.innerHTML = `<div class="space-y-3"><div><label>${isCust?'العميل':'المورد'}</label><select id="pmt-entity" class="w-full"><option value="">-- اختر --</option>${entityOptions}</select></div>
                <div class="grid grid-cols-2 gap-3"><div><label>التاريخ</label><input id="pmt-date" type="date" class="w-full" value="${new Date().toISOString().split('T')[0]}"></div><div><label>الطريقة</label><select id="pmt-method" class="w-full"><option value="cash">نقدي</option><option value="bank_transfer">تحويل بنكي</option><option value="other">أخرى</option></select></div></div>
                <div class="grid grid-cols-2 gap-3"><div><label>المبلغ</label><input id="pmt-amount" type="number" class="w-full" value="0" step="0.01"></div><div><label>البيان</label><input id="pmt-desc" type="text" class="w-full"></div></div></div>`;
                saveBtn.onclick = () => savePaymentFromModal(type);
            } else if (type === 'chartAccount') {
                title.innerText = 'إضافة حساب جديد';
                const parentOpts = db.chartOfAccounts.map(a =>
                    `<option value="${a.id}">${a.code} - ${a.name}</option>`).join('');
                body.innerHTML = `<div class="space-y-3"><div><label>كود الحساب</label><input id="f-code" class="w-full"></div>
                <div><label>اسم الحساب</label><input id="f-name" class="w-full"></div>
                <div class="grid grid-cols-2 gap-3"><div><label>النوع</label><select id="f-type" class="w-full"><option value="asset">أصول</option><option value="liability">خصوم</option><option value="equity">حقوق ملكية</option><option value="revenue">إيرادات</option><option value="expense">مصروفات</option></select></div><div><label>الحساب الأب</label><select id="f-parent" class="w-full"><option value="">-- لا يوجد --</option>${parentOpts}</select></div></div></div>`;
                saveBtn.onclick = () => { const code = document.getElementById('f-code').value.trim(); const name = document
                        .getElementById('f-name').value.trim(); if (!code || !name) { alert('الكود والاسم مطلوبان');
                        return; }
                    const parentVal = document.getElementById('f-parent').value;
                    db.chartOfAccounts.push({ id: Date.now(), code, name, type: document.getElementById('f-type').value,
                        parentId: parentVal ? parseInt(parentVal) : null });
                    finalizeModal('chartOfAccounts'); };
            }
            lucide.createIcons();
        }

        function closeModal() { document.getElementById('modal-overlay').classList.add('hidden');
            document.getElementById('modal-body').innerHTML = '';
            currentEditData = null; }

        function finalizeModal(section) { saveData();
            closeModal();
            renderSection(section); }

        function deleteItem(type, index) {
            if (!confirm('هل أنت متأكد من الحذف؟')) return;
            if (type === 'payments') { const p = db.payments[index]; if (p) { if (p.paymentType === 'customer' && db.customers[
                        p.entityId]) db.customers[p.entityId].balance = (db.customers[p.entityId].balance || 0) + (p
                    .amount || 0); if (p.paymentType === 'supplier' && db.suppliers[p.entityId]) db.suppliers[p.entityId]
                    .balance = (db.suppliers[p.entityId].balance || 0) + (p.amount || 0); } }
            if (type === 'entries') { const e = db.entries[index]; if (e && e.invoiceId) { alert(
                    'لا يمكن حذف قيد مرتبط بفاتورة. احذف الفاتورة أولاً.'); return; } }
            db[type].splice(index, 1);
            saveData();
            renderSection(type === 'entries' ? 'accounting' : type === 'payments' ? 'payments' : type);
        }

        // ─────────────────── EXCEL / BACKUP ───────────────────
        function downloadTemplate() {
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{ "الكود": "C001", "الاسم": "عميل", "الهاتف": "0123",
                "الرصيد": 0, "النوع": "تجزئة" }]), "العملاء");
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{ "الكود": "S001", "اسم المورد": "مورد", "الشركة": "شركة",
                "الرصيد": 0 }]), "الموردين");
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{ "الصنف": "منتج", "النوع": "3", "كود المنتج": "P001",
                "الكمية": 50, "سعر التكلفة": 20, "سعر البيع": 35 }]), "المخزون");
            XLSX.writeFile(wb, "erp_template.xlsx");
        }

        function handleExcelUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => { const data = new Uint8Array(e.target.result); const workbook = XLSX.read(data, { type: 'array' });
                let count = 0; if (workbook.Sheets["العملاء"]) { XLSX.utils.sheet_to_json(workbook.Sheets["العملاء"])
                        .forEach(row => { if (row["الاسم"] && row["الكود"]) { db.customers.push({ code: row["الكود"],
                                name: row["الاسم"], phone: row["الهاتف"] || '', openingBalance: parseFloat(row["الرصيد"]) ||
                                    0, balance: parseFloat(row["الرصيد"]) || 0, customerType: row["النوع"] || 'تجزئة',
                                segment: 'A', paymentMethod: 'نقدي', paymentPeriod: '', taxCard: '', taxName: '',
                                responsiblePerson: '', salesRep: '' });
                            count++; } }); } if (workbook.Sheets["الموردين"]) { XLSX.utils.sheet_to_json(workbook.Sheets[
                            "الموردين"]).forEach(row => { if (row["اسم المورد"] && row["الكود"]) { db.suppliers.push({
                                code: row["الكود"], name: row["اسم المورد"], company: row["الشركة"] || '',
                                transactionType: 'آجل', paymentSystem: '', openingBalance: parseFloat(row["الرصيد"]) || 0,
                                balance: parseFloat(row["الرصيد"]) || 0 });
                            count++; } }); } if (workbook.Sheets["المخزون"]) { XLSX.utils.sheet_to_json(workbook.Sheets[
                            "المخزون"]).forEach(row => { if (row["الصنف"]) { db.inventory.push({ name: row["الصنف"],
                                productType: parseInt(row["النوع"]) || 3, productCode: row["كود المنتج"] || '',
                                quantity: parseFloat(row["الكمية"]) || 0, costPrice: parseFloat(row["سعر التكلفة"]) || 0,
                                sellingPrice: parseFloat(row["سعر البيع"]) || 0 });
                            count++; } }); }
                saveData();
                alert('تم استيراد ' + count + ' سجل');
                showSection('dashboard');
                event.target.value = ''; };
            reader.readAsArrayBuffer(file);
        }

        function exportBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
            const a = document.createElement('a');
            a.setAttribute("href", dataStr);
            a.setAttribute("download", "erp_backup_" + new Date().toISOString().split('T')[0] + ".json");
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        function importBackup(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => { try { const imported = JSON.parse(e.target.result); if (imported.customers && imported
                        .entries !== undefined) { if (!imported.payments) imported.payments = []; if (!imported
                        .chartOfAccounts) imported.chartOfAccounts = []; if (!imported.monthlyClosings) imported
                        .monthlyClosings = [];
                    db = imported;
                    saveData();
                    alert('تم استعادة النسخة بنجاح');
                    location.reload(); } else alert('الملف غير صالح.'); } catch (err) { alert('خطأ في قراءة الملف.'); } };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ─────────────────── DASHBOARD ───────────────────
        function updateDashboard() {
            const dashboard = document.getElementById('dashboard');
            if (!dashboard) return;
            const totalSales = db.invoices.filter(inv => inv.type === 'sale').reduce((s, inv) => s + (inv.total || 0), 0);
            const totalPurchases = db.invoices.filter(inv => inv.type === 'purchase').reduce((s, inv) => s + (inv.total || 0),
                0);
            const totalCosts = db.costs.reduce((s, c) => s + (c.amount || 0), 0);
            const totalProfit = db.invoices.filter(inv => inv.type === 'sale').reduce((s, inv) => s + (inv.totalProfit || 0),
                0);
            const invValue = db.inventory.reduce((s, i) => s + ((i.costPrice || 0) * (i.quantity || 0)), 0);
            const customerBalance = db.customers.reduce((s, c) => s + (c.balance || 0), 0);
            const supplierBalance = db.suppliers.reduce((s, s2) => s + (s2.balance || 0), 0);
            const totalPaymentsIn = db.payments.filter(p => p.paymentType === 'customer').reduce((s, p) => s + (p.amount || 0),
                0);
            const totalPaymentsOut = db.payments.filter(p => p.paymentType === 'supplier').reduce((s, p) => s + (p.amount || 0),
                0);
            dashboard.innerHTML = `
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
              <div class="stat-card border-r-4 border-blue-500"><div class="flex justify-between"><div><p class="text-xs text-gray-500">إجمالي المبيعات</p><h3 class="text-xl font-bold mt-1">${totalSales.toFixed(2)}</h3></div><div class="p-2.5 bg-blue-50 rounded-xl text-blue-500"><i data-lucide="trending-up"></i></div></div></div>
              <div class="stat-card border-r-4 border-green-500"><div class="flex justify-between"><div><p class="text-xs text-gray-500">المشتريات</p><h3 class="text-xl font-bold mt-1">${totalPurchases.toFixed(2)}</h3></div><div class="p-2.5 bg-green-50 rounded-xl text-green-500"><i data-lucide="shopping-cart"></i></div></div></div>
              <div class="stat-card border-r-4 border-purple-500"><div class="flex justify-between"><div><p class="text-xs text-gray-500">صافي الأرباح</p><h3 class="text-xl font-bold mt-1 ${totalProfit>=0?'text-green-600':'text-red-600'}">${totalProfit.toFixed(2)}</h3></div><div class="p-2.5 bg-purple-50 rounded-xl text-purple-500"><i data-lucide="dollar-sign"></i></div></div></div>
              <div class="stat-card border-r-4 border-orange-500"><div class="flex justify-between"><div><p class="text-xs text-gray-500">قيمة المخزون</p><h3 class="text-xl font-bold mt-1">${invValue.toFixed(2)}</h3></div><div class="p-2.5 bg-orange-50 rounded-xl text-orange-500"><i data-lucide="package"></i></div></div></div>
            </div>
            <div class="grid grid-cols-4 gap-4">
              <div class="stat-card border-r-4 border-cyan-500"><p class="text-xs text-gray-500">رصيد العملاء</p><h3 class="text-lg font-bold mt-1">${customerBalance.toFixed(2)}</h3></div>
              <div class="stat-card border-r-4 border-red-500"><p class="text-xs text-gray-500">رصيد الموردين</p><h3 class="text-lg font-bold mt-1 text-red-600">${supplierBalance.toFixed(2)}</h3></div>
              <div class="stat-card border-r-4 border-teal-500"><p class="text-xs text-gray-500">تحصيلات</p><h3 class="text-lg font-bold mt-1 text-green-600">${totalPaymentsIn.toFixed(2)}</h3></div>
              <div class="stat-card border-r-4 border-rose-500"><p class="text-xs text-gray-500">مدفوعات</p><h3 class="text-lg font-bold mt-1 text-red-600">${totalPaymentsOut.toFixed(2)}</h3></div>
            </div>`;
            lucide.createIcons();
        }

        // ─────────────────── EVENT LISTENERS ───────────────────
        document.getElementById('statement-overlay').addEventListener('click', function(e) { if (e.target === this)
                closeStatement(); });
        document.getElementById('modal-overlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
        document.getElementById('invoice-pdf-overlay').addEventListener('click', function(e) { if (e.target === this)
                closeInvoicePDF(); });
        document.getElementById('current-date').innerText = new Intl.DateTimeFormat('ar-EG', { dateStyle: 'full' }).format(
            new Date());

        updateDashboard();
        console.log('✅ ERP System v3.5 - تم التحميل بنجاح');
        console.log('📊 العملاء:', db.customers.length, '| الموردين:', db.suppliers.length, '| المخزون:', db.inventory.length,
            '| الفواتير:', db.invoices.length, '| القيود:', db.entries.length, '| الحسابات:', db.chartOfAccounts.length);
    </script>
</body>
</html>
